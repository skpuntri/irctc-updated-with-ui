
services:
  mysql-db:
    restart: always
    image: mysql:8.0
    container_name: mysql-db
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: backendx_irctc
    networks:
      - irctc-network
    volumes:
      - mysql-db-data:/var/lib/mysql
      - ./init:/docker-entrypoint-initdb.d

  boot-app:
    build: .
    image: irctc-backend
    container_name: irctc-backend
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-db:3306/backendx_irctc?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysql-db
    networks:
      - irctc-network

networks:
  irctc-network:
    driver: bridge
volumes:
  mysql-db-data: